<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block description %}SertainsLabs SpA - Desarrollo web profesional en Ñuñoa, Santiago para empresas y emprendimientos.{% endblock %}">
    <title>{% block title %}SertainsLabs SpA - Desarrollo web empresarial en Santiago{% endblock %}</title>
    <link rel="canonical" href="{% block canonical %}https://www.sertainslabs.cl/{% endblock %}">

    <meta property="og:title" content="{% block og_title %}SertainsLabs SpA{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Desarrollo web profesional para empresas que quieren crecer.{% endblock %}">
    <meta property="og:type" content="website">
    <meta property="og:url" content="{% block og_url %}https://www.sertainslabs.cl/{% endblock %}">
    <meta property="og:image" content="{% block og_image %}https://www.sertainslabs.cl{{ url_for('static', filename='img/og-image.jpg') }}{% endblock %}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:locale" content="es_CL">
    <meta property="og:site_name" content="SertainsLabs SpA">

    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{% block twitter_title %}{{ self.og_title() }}{% endblock %}">
    <meta name="twitter:description" content="{% block twitter_description %}{{ self.og_description() }}{% endblock %}">
    <meta name="twitter:image" content="{% block twitter_image %}{{ self.og_image() }}{% endblock %}">

    <meta name="robots" content="{% block robots %}index, follow{% endblock %}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400;1,600&family=Inter:wght@300;400;500;600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <link rel="preload" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400;1,600&family=Inter:wght@300;400;500;600&display=swap">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    </noscript>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='img/logo-sertains-labs.webp') }}" type="image/webp">
</head>
<body>
<nav id="mainNav">
    <a href="/" class="nav-brand">
        <img src="{{ url_for('static', filename='img/logo-sertains-labs.webp') }}" alt="SertainsLabs" width="287" height="96" style="height:96px; width:auto;" fetchpriority="high">
    </a>
    <ul class="nav-links" id="navLinks">
        <li><a href="/">Inicio</a></li>
        <li><a href="/servicios">Servicios</a></li>
        <li><a href="/equipo">Equipo</a></li>
        <li><a href="/portafolio">Portafolio</a></li>
        <li><a href="/contacto" class="nav-cta">Agendar reunión</a></li>
    </ul>
    <button class="hamburger" id="hamburger" aria-label="Menú">
        <span></span><span></span><span></span>
    </button>
</nav>
<main>
    {% block content %}{% endblock %}
</main>
<footer>
    <div class="footer-inner">
        <div class="footer-brand">
            <img src="{{ url_for('static', filename='img/logo-sertains-labs.webp') }}" alt="SertainsLabs" width="215" height="72" style="height:72px;" loading="lazy">
            <p>Desarrollo web profesional para empresas que quieren crecer.</p>
            <!-- REDES SOCIALES EN FOOTER - AGREGAR AQUÍ -->
            <div class="footer-social">
                <a href="https://www.instagram.com/sertainslabs/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
                    <i class="fab fa-instagram"></i>
                </a>
                <a href="mailto:contacto@sertainslabs.cl" aria-label="Correo electrónico">
                    <i class="fas fa-envelope"></i>
                </a>
            </div>
        </div>
        <div class="footer-links">
            <a href="/servicios">Servicios</a>
            <a href="/equipo">Equipo</a>
            <a href="/contacto">Contacto</a>
        </div>
    </div>
    <div class="footer-bottom">
        <p>© 2026 SertainsLabs SpA — Todos los derechos reservados</p>
    </div>
</footer>
<script>
    // Navbar scroll
    const nav = document.getElementById('mainNav');
    window.addEventListener('scroll', () => {
        nav.classList.toggle('scrolled', window.scrollY > 40);
    });
    // Hamburger
    document.getElementById('hamburger').addEventListener('click', () => {
        document.getElementById('navLinks').classList.toggle('open');
    });
    // Reveal on scroll
    const observer = new IntersectionObserver((entries) => {
        entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
    }, { threshold: 0.12 });
    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
</script>
{% block scripts %}{% endblock %}
</body>
</html>
